<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical Trivial Pursuit - Rintamahaarat</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">

  <!-- React 18 Production CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    body {
      background-color: #070a12;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .radar-grid {
      background-size: 32px 32px;
      background-image:
              linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

<div id="root"></div>

<script>
  const { useState, createElement: e } = React;

  // Pelin datat ja kysymykset Esa Kujalan säännöillä
  const NODE_TYPES = {
    yellow: { name: 'Standardi', color: '#facc15', border: '#ca8a04', desc: 'Perusvisailu' },
    red: { name: 'Chrono', color: '#f43f5e', border: '#be123c', desc: 'Järjestä tapahtumat' },
    black: { name: 'Numerovisailu', color: '#1e293b', border: '#475569', textCol: '#cbd5e1', desc: 'Taktinen arvaus' }
  };

  const SIZES = {
    small: { name: 'Pieni', multiplier: 1, scale: 12 },
    medium: { name: 'Keskikokoinen', multiplier: 2, scale: 16 },
    large: { name: 'Iso', multiplier: 3, scale: 20 }
  };

  // Tehtäväpankki
  const QUESTIONS_BANK = {
    yellow: [
      { q: 'Mikä on Suomen valtiosäännön mukainen pääkaupunki?', options: ['Turku', 'Helsinki', 'Tampere', 'Oulu'], correct: 1 },
      { q: 'Mikä alkuaine on kullan kemiallinen merkki?', options: ['Ag', 'Fe', 'Au', 'Cu'], correct: 2 },
      { q: 'Mikä maailman meri ympäröi Antarktikaa?', options: ['Eteläinen jäämeri', 'Atlantti', 'Intian valtameri', 'Tyynimeri'], correct: 0 },
      { q: 'Kuinka monta kenttäpelaajaa on jääkiekkojoukkueella kentällä?', options: ['5', '6', '4', '7'], correct: 0 }
    ],
    red: [
      { events: [{text: 'Suomen itsenäistyminen', year: 1917}, {text: 'Toinen maailmansota alkoi', year: 1939}]},
      { events: [{text: 'Rooman valtakunta perustettiin', year: -753}, {text: 'Ranskan vallankumous', year: 1789}, {text: 'Berliinin muuri kaatui', year: 1989}]},
      { events: [{text: 'Mika Waltarin Sinuhe ilmestyi', year: 1945}, {text: 'Helsingin olympialaiset', year: 1952}, {text: 'Suomi EU:hun', year: 1995}, {text: 'Nokia 3310 julkaistiin', year: 2000}]}
    ],
    black: [
      { q: 'Kuinka monta minuuttia kestää virallinen Cooperin testi?', ans: 12 },
      { q: 'Montako olutta mahtuu perinteiseen "mäyräkoiraan"?', ans: 6 },
      { q: 'Vuosi, jolloin Titanic upposi Atlantilla:', ans: 1912 },
      { q: 'Kuinka monta astetta on suorassa kulmassa?', ans: 90 }
    ]
  };

  function App() {
    const [players, setPlayers] = useState([
      { id: 1, name: 'Alfa Joukkue', color: '#38bdf8', score: 0, stage: 0 },
      { id: 2, name: 'Bravo Joukkue', color: '#f43f5e', score: 0, stage: 0 }
    ]);
    const [activePlayerIdx, setActivePlayerIdx] = useState(0);
    const [activeChallenge, setActiveChallenge] = useState(null);
    const [selectedPath, setSelectedPath] = useState(null);
    const [feedback, setFeedback] = useState(null);
    const [winner, setWinner] = useState(null);

    // Numerovisailun tila
    const [numGuess, setNumGuess] = useState('');
    // Chrono-järjestyksen tila
    const [chronoOrder, setChronoOrder] = useState([]);

    const activePlayer = players[activePlayerIdx];

    // Generoidaan satunnaiset 2-3 haaraa seuraavalle etapille
    const getNextBranches = (stage) => {
      if (stage >= 5) return []; // Maali
      const types = ['yellow', 'red', 'black'];
      const sizes = ['small', 'medium', 'large'];

      const count = Math.random() > 0.5 ? 3 : 2;
      const branches = [];
      for (let i = 0; i < count; i++) {
        const type = types[Math.floor(Math.random() * types.length)];
        const size = sizes[Math.floor(Math.random() * sizes.length)];
        branches.push({ id: i, type, size, label: `${NODE_TYPES[type].name} (${SIZES[size].name})` });
      }
      return branches;
    };

    const [currentBranches, setCurrentBranches] = useState(getNextBranches(0));

    const handleSelectBranch = (branch) => {
      setSelectedPath(branch);
      // Valmistellaan haaste tyypin ja koon mukaan
      if (branch.type === 'yellow') {
        const pool = QUESTIONS_BANK.yellow;
        const q = pool[Math.floor(Math.random() * pool.length)];
        setActiveChallenge({ type: 'yellow', size: branch.size, data: q });
      } else if (branch.type === 'red') {
        const count = branch.size === 'small' ? 2 : branch.size === 'medium' ? 3 : 4;
        const poolItem = QUESTIONS_BANK.red.find(item => item.events.length === count) || QUESTIONS_BANK.red[0];
        // Sekoitetaan tapahtumat satunnaisesti
        const shuffled = [...poolItem.events].sort(() => Math.random() - 0.5);
        setActiveChallenge({ type: 'red', size: branch.size, data: { original: poolItem.events, shuffled } });
        setChronoOrder(shuffled);
      } else if (branch.type === 'black') {
        const pool = QUESTIONS_BANK.black;
        const q = pool[Math.floor(Math.random() * pool.length)];
        const startPoints = branch.size === 'small' ? 30 : branch.size === 'medium' ? 20 : 10;
        setActiveChallenge({ type: 'black', size: branch.size, data: q, points: startPoints });
        setNumGuess('');
      }
    };

    // Tarkistukset
    const submitYellow = (optionIdx) => {
      const isCorrect = optionIdx === activeChallenge.data.correct;
      resolveChallenge(isCorrect, 150);
    };

    const submitChrono = () => {
      // Tarkistetaan onko vuosiluvut nousevassa järjestyksessä
      let isCorrect = true;
      for (let i = 0; i < chronoOrder.length - 1; i++) {
        if (chronoOrder[i].year > chronoOrder[i+1].year) isCorrect = false;
      }
      resolveChallenge(isCorrect, 200);
    };

    const submitNumber = () => {
      const val = parseInt(numGuess, 10);
      if (isNaN(val)) return;
      const actual = activeChallenge.data.ans;

      if (val < actual) {
        // Liian pieni -> polku sulkeutuu välittömästi!
        setFeedback({ type: 'error', message: `LIIAN PIENI! (Oikea: ${actual}). Polku sortui ja sulkeutui! ❌` });
        setTimeout(() => nextTurn(false), 2000);
      } else if (val === actual) {
        setFeedback({ type: 'success', message: 'TARKKA OSUMA! MAHTavaa! 🎯' });
        setTimeout(() => nextTurn(true, 300), 1600);
      } else {
        // Liian suuri -> vähennetään erotus pisteistä
        const diff = val - actual;
        const remaining = activeChallenge.points - diff;
        if (remaining <= 0) {
          setFeedback({ type: 'error', message: `Veikkaus heitti ${diff} ohi, pisteet loppuivat! Polku sulkeutui. ❌` });
          setTimeout(() => nextTurn(false), 2000);
        } else {
          setFeedback({ type: 'success', message: `Yläkanttiin meni (${diff} ohi), mutta selvisit hengissä ${remaining} pisteellä! 🎖️` });
          setTimeout(() => nextTurn(true, 100), 1800);
        }
      }
    };

    const resolveChallenge = (isCorrect, rewardScore) => {
      if (isCorrect) {
        setFeedback({ type: 'success', message: 'OIKEIN! HAARA VALLATTU JA ETENEMINEN VAHVISTETTU! 🎖️' });
        setTimeout(() => nextTurn(true, rewardScore), 1500);
      } else {
        setFeedback({ type: 'error', message: 'VÄÄRIN! Polku sulkeutuu ja umpeutuu. ❌' });
        setTimeout(() => nextTurn(false), 1800);
      }
    };

    const nextTurn = (success, scoreAdd = 0) => {
      setPlayers(prev => prev.map((p, idx) => {
        if (idx === activePlayerIdx) {
          const newStage = success ? p.stage + 1 : p.stage;
          const newScore = p.score + (success ? scoreAdd : 0);
          const updated = { ...p, stage: newStage, score: newScore };
          if (newStage >= 5) setWinner(updated);
          return updated;
        }
        return p;
      }));

      setActiveChallenge(null);
      setSelectedPath(null);
      setFeedback(null);
      setCurrentBranches(getNextBranches(activePlayer.stage + (success ? 1 : 0)));
      setActivePlayerIdx(prev => (prev + 1) % players.length);
    };

    const resetGame = () => {
      setPlayers([
        { id: 1, name: 'Alfa Joukkue', color: '#38bdf8', score: 0, stage: 0 },
        { id: 2, name: 'Bravo Joukkue', color: '#f43f5e', score: 0, stage: 0 }
      ]);
      setActivePlayerIdx(0);
      setActiveChallenge(null);
      setSelectedPath(null);
      setWinner(null);
      setFeedback(null);
      setCurrentBranches(getNextBranches(0));
    };

    return e('div', { className: 'min-h-screen flex flex-col justify-between p-3 md:p-6 max-w-5xl mx-auto w-full text-white' },
            e('header', { className: 'flex flex-col md:flex-row items-center justify-between border-b border-gray-800 pb-4 mb-6 gap-4' },
                    e('div', { className: 'flex items-center gap-3' },
                            e('div', { className: 'w-10 h-10 rounded-xl bg-indigo-600/25 border border-indigo-500/40 flex items-center justify-center text-xl font-black text-indigo-400 font-mono shadow-lg' }, '🎯'),
                            e('div', null,
                                    e('h1', { className: 'text-xl md:text-2xl font-black tracking-tight text-white uppercase font-mono' }, 'TACTICAL TRIVIAL PURSUIT — HAARAUTUVAT POLUT'),
                                    e('p', { className: 'text-xs text-gray-400 font-medium' }, 'Esa Kujalan taktiset säännöt 🇫🇮')
                            )
                    ),
                    e('div', { className: 'bg-gray-900 border border-gray-800 px-4 py-2 rounded-xl text-xs font-mono flex items-center gap-3' },
                            e('span', { className: 'text-gray-400' }, 'VUOROSSA:'),
                            e('strong', { style: { color: activePlayer.color } }, activePlayer.name)
                    )
            ),

            e('main', { className: 'grid grid-cols-1 md:grid-cols-12 gap-6 items-start my-auto' },
                    // Kartta / Polut
                    e('div', { className: 'md:col-span-6 bg-gray-900/90 border border-gray-800 p-6 rounded-3xl shadow-xl flex flex-col gap-5 radar-grid' },
                            e('h2', { className: 'text-xs font-mono font-bold tracking-widest text-gray-300 uppercase border-b border-gray-800 pb-3' }, 'RINTAMAPOLKU (ETAISYYS MAALIIN 5 VAIHETTA)'),

                            e('div', { className: 'flex flex-col gap-4' },
                                    players.map(p =>
                                            e('div', { key: p.id, className: 'bg-gray-950 p-4 rounded-2xl border border-gray-800 flex items-center justify-between' },
                                                    e('div', { className: 'flex items-center gap-3' },
                                                            e('span', { className: 'w-4 h-4 rounded-full', style: { backgroundColor: p.color } }),
                                                            e('span', { className: 'font-bold text-sm' }, p.name)
                                                    ),
                                                    e('div', { className: 'font-mono text-xs flex items-center gap-4' },
                                                            e('span', { className: 'text-amber-400 font-bold' }, p.score + ' PTS'),
                                                            e('span', { className: 'text-indigo-400 font-bold' }, `Vaihe ${p.stage} / 5`)
                                                    )
                                            )
                                    )
                            ),

                            // Valintaikkuna seuraavasta haarasta
                            !activeChallenge && e('div', { className: 'bg-gray-950 p-5 rounded-2xl border border-gray-800 flex flex-col gap-3' },
                                    e('span', { className: 'text-xs font-mono text-indigo-400 font-bold uppercase' }, 'Valitse seuraava polku:'),
                                    e('div', { className: 'grid grid-cols-1 gap-2' },
                                            current.map = currentBranches.map(branch => {
                                              const nodeInfo = NODE_TYPES[branch.type];
                                              const sizeInfo = SIZES[branch.size];
                                              return e('button', {
                                                        key: branch.id,
                                                        onClick: () => handleSelectBranch(branch),
                                                        className: 'p-3 rounded-xl border border-gray-700 bg-gray-900 hover:bg-gray-800 flex items-center justify-between text-xs font-mono cursor-pointer transition-all'
                                                      },
                                                      e('div', { className: 'flex items-center gap-2.5' },
                                                              e('span', { className: 'w-4 h-4 rounded-full border border-white/40', style: { backgroundColor: nodeInfo.color } }),
                                                              e('span', { className: 'font-bold text-white' }, nodeInfo.name)
                                                      ),
                                                      e('span', { className: 'text-gray-400 bg-gray-950 px-2 py-1 rounded border border-gray-800' }, sizeInfo.name)
                                              );
                                            })
                                    )
                            )
                    ),

                    // Aktiivinen visailu / haaste paneeli
                    e('div', { className: 'md:col-span-6 bg-gray-900/90 border border-gray-800 p-6 rounded-3xl shadow-xl flex flex-col gap-5' },
                            e('h2', { className: 'text-xs font-mono font-bold tracking-widest text-gray-300 uppercase border-b border-gray-800 pb-3' }, 'TAKTINEN TEHTÄVÄRUUTU'),

                            activeChallenge ? e('div', { className: 'flex flex-col gap-4' },
                                    // Keltainen standardi
                                    activeChallenge.type === 'yellow' && e('div', { className: 'flex flex-col gap-4' },
                                            e('div', { className: 'bg-yellow-500/10 border border-yellow-500/30 p-4 rounded-2xl' },
                                                    e('span', { className: 'text-[10px] font-mono text-yellow-400 font-bold uppercase block mb-1' }, 'KELTAINEN • STANDARDI'),
                                                    e('p', { className: 'text-base font-bold text-white' }, activeChallenge.data.q)
                                            ),
                                            e('div', { className: 'grid grid-cols-1 gap-2' },
                                                    activeChallenge.data.options.map((opt, idx) =>
                                                            e('button', {
                                                              key: idx,
                                                              onClick: () => submitYellow(idx),
                                                              disabled: feedback !== null,
                                                              className: 'p-3 bg-gray-800 hover:bg-yellow-600/40 rounded-xl font-semibold text-xs border border-gray-700 text-left cursor-pointer transition-all'
                                                            }, opt)
                                                    )
                                            )
                                    ),

                                    // Punainen chrono
                                    activeChallenge.type === 'red' && e('div', { className: 'flex flex-col gap-4' },
                                            e('div', { className: 'bg-rose-500/10 border border-rose-500/30 p-4 rounded-2xl' },
                                                    e('span', { className: 'text-[10px] font-mono text-rose-400 font-bold uppercase block mb-1' }, 'PUNAINEN • CHRONO (Järjestä aikajärjestykseen vanhimmasta uusimpaan)'),
                                                    e('p', { className: 'text-xs text-gray-300 mb-2' }, 'Raahaa tai siirrä tapahtumia oikeaan järjestykseen:'),
                                            ),
                                            e('div', { className: 'flex flex-col gap-2' },
                                                    chronoOrder.map((ev, idx) =>
                                                            e('div', { key: idx, className: 'flex items-center justify-between bg-gray-950 p-3 rounded-xl border border-gray-800 text-xs font-mono' },
                                                                    e('span', null, `${idx + 1}. ${ev.text}`),
                                                                    e('div', { className: 'flex gap-1' },
                                                                            e('button', { onClick: () => {
                                                                                if (idx > 0) {
                                                                                  const copy = [...chronoOrder];
                                                                                  const temp = copy[idx]; copy[idx] = copy[idx-1]; copy[idx-1] = temp;
                                                                                  setChronoOrder(copy);
                                                                                }
                                                                              }, className: 'px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded cursor-pointer' }, '⬆️'),
                                                                            e('button', { onClick: () => {
                                                                                if (idx < chronoOrder.length - 1) {
                                                                                  const copy = [...chronoOrder];
                                                                                  const temp = copy[idx]; copy[idx] = copy[idx+1]; copy[idx+1] = temp;
                                                                                  setChronoOrder(copy);
                                                                                }
                                                                              }, className: 'px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded cursor-pointer' }, '⬇️')
                                                                    )
                                                            )
                                                    )
                                            ),
                                            e('button', {
                                              onClick: submitChrono,
                                              disabled: feedback !== null,
                                              className: 'py-3 bg-rose-600 hover:bg-rose-500 text-white font-black text-xs uppercase rounded-xl cursor-pointer shadow'
                                            }, 'VAHVISTA AIKAJÄRJESTYS')
                                    ),

                                    // Musta numerovisailu
                                    activeChallenge.type === 'black' && e('div', { className: 'flex flex-col gap-4' },
                                            e('div', { className: 'bg-slate-800 border border-slate-700 p-4 rounded-2xl' },
                                                    e('span', { className: 'text-[10px] font-mono text-slate-300 font-bold uppercase block mb-1' }, `MUSTA • NUMEROVISAILU (Pistebudjetti: ${activeChallenge.points} PTS)`),
                                                    e('p', { className: 'text-sm font-bold text-white mt-1' }, activeChallenge.data.q)
                                            ),
                                            e('input', {
                                              type: 'number',
                                              value: numGuess,
                                              onChange: (e) => setNumGuess(e.target.value),
                                              placeholder: 'Kirjoita arvioitu luku...',
                                              className: 'p-3 bg-gray-950 border border-gray-800 rounded-xl text-white font-mono text-sm'
                                            }),
                                            e('button', {
                                              onClick: submitNumber,
                                              disabled: feedback !== null || numGuess === '',
                                              className: 'py-3 bg-slate-700 hover:bg-slate-600 text-white font-black text-xs uppercase rounded-xl cursor-pointer shadow'
                                            }, 'LÄHETÄ ARVAUS')
                                    ),

                                    feedback && e('div', { className: `p-4 rounded-2xl text-center text-xs font-mono font-bold ${feedback.type === 'success' ? 'bg-emerald-950 border border-emerald-500 text-emerald-200' : 'bg-rose-950 border border-rose-500 text-rose-200'}` },
                                            feedback.message
                                    )
                            ) : e('div', { className: 'bg-gray-950 p-8 rounded-2xl border border-gray-800 text-center text-xs font-mono text-gray-400' },
                                    'Valitse vasemmalta haara aloittaaksesi vuoron.'
                            )
                    )
            ),

            winner && e('div', { className: 'fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50' },
                    e('div', { className: 'bg-gray-900 border-2 border-emerald-500 rounded-3xl p-8 w-full max-w-md text-center flex flex-col gap-6' },
                            e('h2', { className: 'text-2xl font-black uppercase font-mono text-white' }, `VOITTO SAAVUTETTU! 🏆\n${winner.name} hallitsee rintamaa!`),
                            e('button', { onClick: resetGame, className: 'py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black uppercase rounded-2xl cursor-pointer' }, 'UUSI PELI')
                    )
            )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>

</body>
</html>
